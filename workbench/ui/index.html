<!doctype html>
<html lang="en" data-theme="green" data-detail="calm" data-answered="0" data-permissions="ask" class="boot">
<head>
<!-- The server replaces data-theme, data-detail and data-answered on <html> with the person's choices as it sends this
     page (src/core/prefs.mjs), so the first paint already has their look, and data-permissions with the permission mode
     that is on, so the Full permissions button is right from the start. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workbench</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/ui/app.css">
<link rel="preload" href="/ui/fonts/JetBrainsMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/ui/fonts/JetBrainsMono-Medium.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/ui/fonts/JetBrainsMono-SemiBold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/ui/fonts/JetBrainsMono-Bold.woff2" as="font" type="font/woff2" crossorigin>
<script type="module" src="/ui/app.js"></script>
</head>
<body>

<!-- One mark per state, so state never reads by colour alone. -->
<svg id="sprite" width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="g-need" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" rx="2" fill="currentColor"/></symbol>
  <symbol id="g-ask" viewBox="0 0 12 12"><path d="M3 1.4h6a2 2 0 0 1 2 2v3.7a2 2 0 0 1-2 2H5.7l-3 2.5V9a2 2 0 0 1-1.7-1.9V3.4a2 2 0 0 1 2-2z" fill="currentColor"/></symbol>
  <symbol id="g-stuck" viewBox="0 0 12 12"><path d="M6 1.2 11.3 10.6H.7z" fill="currentColor"/></symbol>
  <symbol id="g-ok" viewBox="0 0 12 12"><path d="M6 .6 11.4 6 6 11.4.6 6z" fill="currentColor"/></symbol>
  <symbol id="g-word" viewBox="0 0 12 12"><path d="M6 1.6 10.4 6 6 10.4 1.6 6z" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="g-work" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.6" fill="currentColor"/></symbol>
  <symbol id="g-wait" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M6 1.7a4.3 4.3 0 0 1 0 8.6z" fill="currentColor"/></symbol>
  <symbol id="g-fail" viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
  <symbol id="g-cfail" viewBox="0 0 12 12"><path d="M6 1.4 10.6 6 6 10.6 1.4 6z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4.4 4.4l3.2 3.2M7.6 4.4 4.4 7.6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></symbol>
  <symbol id="g-off" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.2" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
  <symbol id="g-sleep" viewBox="0 0 24 24"><path d="M19.5 14.2A7.8 7.8 0 1 1 9.8 4.5a6.2 6.2 0 0 0 9.7 9.7z" fill="currentColor"/></symbol>
  <symbol id="g-mic" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></symbol>
  <symbol id="g-laptop" viewBox="0 0 24 24"><rect x="5" y="5.5" width="14" height="9.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 18.5h18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="g-cloud" viewBox="0 0 24 24"><path d="M7.5 18.5h9.2a3.8 3.8 0 0 0 .5-7.57A5.4 5.4 0 0 0 6.9 9.9 4.3 4.3 0 0 0 7.5 18.5z" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <!-- The git mark: a line of work leaving a trunk and joining it again. -->
  <symbol id="g-git" viewBox="0 0 16 16"><path d="M4.5 1.5v13M4.5 10.5 10 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="4.5" cy="3" r="1.9" fill="currentColor"/><circle cx="4.5" cy="13" r="1.9" fill="currentColor"/><circle cx="11.5" cy="4" r="1.9" fill="currentColor"/></symbol>
</svg>

<!-- Two screens stacked: the board, and below it the git screen. The one not shown is inert and hidden. The connect
     panel (Agents & keys) is a dialog after them, over either. -->
<div id="boardScreen" class="screen">
<!-- The board itself, drawn once per size: decoration only. -->
<svg id="board" class="layer" aria-hidden="true"></svg>
<!-- Copper that changes with state: connections, lit lines, queue pads, brackets, pulses. -->
<svg id="wires" class="layer" aria-hidden="true"></svg>

<main id="main">
  <!-- The core is you. It comes first, so it is the first thing the keyboard reaches. -->
  <section id="core" aria-label="What needs you" data-box="core">
    <div class="pages" id="pages" data-box="pages"></div>
    <div class="pages probe" id="probe" aria-hidden="true"></div>
    <form id="bar" autocomplete="off" data-box="bar">
      <span class="to" id="to"><span id="toText"></span><button type="button" id="toCancel" aria-label="Stop replying">×</button></span>
      <span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      <span class="field" data-box="field"><input id="say" aria-label="Type what you want, or hold the space bar to talk"><span class="ph" id="ph" aria-hidden="true"></span></span>
      <span class="heard" id="heard" data-clip-ok="the words heard so far; all of them are sent"></span>
      <button type="button" id="mic" aria-pressed="false" aria-label="Talk"><svg aria-hidden="true"><use href="#g-mic"/></svg></button>
    </form>
  </section>
  <p class="sr" id="announce" aria-live="polite"></p>

  <!-- Agents and helpers: buttons over the board, one tab stop, arrow keys move between them. -->
  <div id="parts" role="toolbar" aria-orientation="vertical" aria-label="Your agents and their helpers"></div>

  <!-- The DRAM under the core, wired to it: it opens the git screen. -->
  <button id="dram" type="button" aria-controls="gitScreen" data-box="dram" aria-label="Git: your branch and your agents’ branches. Opens the git screen."><span class="git" aria-hidden="true">git</span></button>
  <!-- The files chip beside it (U3): it opens the file view, the core's lid grown into a sheet. -->
  <button id="filesChip" type="button" hidden aria-haspopup="dialog" aria-controls="fileSheet" aria-keyshortcuts="Meta+P Control+P" data-box="fileschip" aria-label="Files: the files in your folder and your agents’ copies. Opens the file view."><span class="fl" aria-hidden="true">files</span></button>

  <div id="machines" role="group" aria-label="Machines"></div>
  <button id="tray" type="button" hidden aria-haspopup="dialog" aria-controls="trayList" aria-expanded="false"></button>
  <p id="said" role="status" aria-live="polite" data-box="said"></p>
</main>

<header id="top">
  <button id="brand" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="look" data-box="brand"><span class="mk" aria-hidden="true"></span><span>workbench</span></button>
  <span class="badge" id="mode" hidden data-box="badge"></span>
  <span class="silk repo" id="repo" hidden data-box="repo"></span>
  <span class="silk link-note" id="conn" hidden role="status" data-box="conn"></span>
  <span class="silk spend" id="spend" hidden data-box="spend" title="What your agents have cost so far today. Agents that have not reported a cost are not included."></span>
  <!-- Full permissions: quiet while agents ask before risky steps, lit while they run every step without asking. Pressed
       when off, it asks the engine, whose card comes in the middle; pressed when on, it turns them off. -->
  <button id="permBtn" type="button" hidden aria-pressed="false" data-box="permbtn"><span class="led" aria-hidden="true"></span><span class="lbl">Full permissions</span></button>
  <!-- Agents & keys: its light is calm when an agent is ready for new work, and lit when none is. It opens the panel. -->
  <button id="connectBtn" type="button" hidden aria-haspopup="dialog" aria-controls="connect" data-box="connectbtn"><span class="led" aria-hidden="true"></span><span class="lbl">Agents &amp; keys</span></button>
</header>

<!-- Look and detail: the quiet menu under the workbench mark. -->
<div id="look" class="pop menu" role="dialog" aria-label="Look and detail" hidden data-box="menu">
  <fieldset><legend>Look</legend>
    <label><input type="radio" name="theme" value="green"><span>Green</span></label>
    <label><input type="radio" name="theme" value="black-gold"><span>Black and gold</span></label>
    <label><input type="radio" name="theme" value="ivory"><span>Ivory</span></label>
  </fieldset>
  <fieldset><legend>Detail</legend>
    <label><input type="radio" name="detail" value="calm"><span>Calm</span></label>
    <label><input type="radio" name="detail" value="more"><span>More</span></label>
  </fieldset>
  <p class="note">You can also type or say “ivory”, “black and gold”, “green board”, “more detail” or “less detail”.</p>
</div>

<div id="card" role="tooltip" hidden data-box="card"></div>
<div id="pop" class="pop" role="dialog" aria-label="Machines" hidden data-box="pop"></div>
<div id="trayList" class="pop" role="dialog" aria-label="The done tray" hidden data-box="traylist"></div>
</div>

<!-- The git screen: your branch as a gold trunk, each agent's branch a copper trace, newest at the top, where the wire
     from the DRAM arrives. Drawn by gitscreen.js when it opens. -->
<section id="gitScreen" class="screen" aria-labelledby="gitTitle" inert aria-hidden="true">
  <svg id="gitBoard" class="layer" aria-hidden="true"></svg>
  <!-- The top band, either side of the wire that comes in from the board: where you are on the left, what needs you
       and the place to type on the right. -->
  <header id="gitTop">
    <div class="gleft" data-box="gitleft">
      <div class="grow">
        <button id="gitBack" type="button"><span class="arr" aria-hidden="true">↑</span> Back to the board</button>
        <span class="badge" id="gitMode" hidden>DEMO</span>
        <div class="gtitle"><svg class="gmark" aria-hidden="true"><use href="#g-git"/></svg><h1 id="gitTitle" tabindex="-1">git</h1></div>
      </div>
      <p id="gitState"></p>
    </div>
    <div class="gright" data-box="gitright">
      <div class="grow">
        <button id="gitNeeds" type="button" hidden></button>
        <form id="gitBar" autocomplete="off"><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span><input id="gitSay" aria-label="Type what you want. It goes to Workbench, about the agent shown here."><span class="ph" id="gitPh" aria-hidden="true">type here</span><span class="heard" id="gitHeard" data-clip-ok="the words heard so far; all of them are sent"></span></form>
      </div>
      <p id="gitSaid" role="status" aria-live="polite"></p>
    </div>
  </header>
  <div id="gitGraph" role="listbox" aria-label="Commits, newest first" data-scroll="1"></div>
  <section id="gitDetail" aria-labelledby="gitDetailTitle" hidden data-box="gitdetail"></section>
  <button id="gitWireEnd" type="button" tabindex="-1" aria-label="Back to the board"></button>
  <!-- What this screen says to screen readers: a card that comes in the detail, something new that needs you. The
       board's own live region is hidden while this screen shows. -->
  <p class="sr" id="gitAnnounce" aria-live="polite"></p>
</section>

<!-- Agents & keys: a dialog over whichever screen shows (so it is outside both), with its own focus order. connect.js
     draws its body; Esc closes it, and the keyboard goes back to what opened it. -->
<dialog id="connect" aria-labelledby="connectTitle" data-box="connect">
  <div class="cn-head">
    <h2 id="connectTitle" tabindex="-1">Agents &amp; keys</h2>
    <button id="connectNeeds" type="button" hidden></button>
    <button id="connectClose" type="button" aria-label="Close Agents &amp; keys">×</button>
  </div>
  <p id="connectSaid" class="cn-said" role="status" aria-live="polite"></p>
  <div id="connectBody" class="cn-body" data-scroll="1"></div>
</dialog>

<!-- The file view: the core's lid grown into a wide sheet over whichever screen shows, one file at a time. fileview.js
     fills it: the path you can click, whose copy it is, the code (or a folder, or what the field finds), and the field
     that finds a file. Esc closes it, and the keyboard goes back to what opened it. -->
<dialog id="fileSheet" aria-labelledby="fvTitle" data-box="filesheet">
  <div class="fv-shade" aria-hidden="true"></div>
  <div class="fv-sheet" id="fvSheet">
    <header class="fv-head">
      <h2 id="fvTitle" class="fv-path" tabindex="-1"></h2>
      <button id="fvNeeds" class="fv-needs" type="button" hidden></button>
      <span class="fv-acts" id="fvActs"></span>
      <button id="fvClose" class="fv-x" type="button" aria-label="Close the file view">✕</button>
    </header>
    <div class="fv-whose" id="fvWhose"></div>
    <div class="fv-body" id="fvBody">
      <div class="fv-code" id="fvCode" data-scroll="1" tabindex="0"><div class="fv-sizer" id="fvSizer"><div class="fv-rows" id="fvRows"></div></div></div>
      <div class="fv-edit" id="fvEdit" data-scroll="1" hidden><div class="fv-esizer" id="fvEsizer"><div class="fv-enums" id="fvEnums" aria-hidden="true"></div><textarea id="fvText" class="fv-ta" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea></div></div>
      <div class="fv-list" id="fvList" role="listbox" aria-label="Files" data-scroll="1" hidden></div>
      <div class="fv-note" id="fvNote" hidden></div>
    </div>
    <form class="fv-bar" id="fvBar" autocomplete="off">
      <input id="fvFind" role="combobox" aria-controls="fvList" aria-expanded="false" aria-autocomplete="list" aria-label="Find a file, a line of this file, or words in the files" spellcheck="false" autocomplete="off">
      <span class="ph" id="fvPh" aria-hidden="true">find a file</span>
      <kbd id="fvKey" aria-hidden="true"></kbd>
    </form>
  </div>
  <p class="sr" id="fvSaid" role="status" aria-live="polite"></p>
</dialog>
</body>
</html>
