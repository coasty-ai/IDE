:root {
  --bench: #060807;
  --silk: #edf0e8; --silk-2: #b4c4b8;
  --need: #ffb950; --stuck: #ff8d61; --ok: #6fdcaa; --word: #c3c8c0; --work: #9cbcff; --fail: #ff8b80; --sleep: #c4baff;
  --lit: #ffc061; --tin: #8f958f; --cap: #b9bdb6;
  --ease: cubic-bezier(.2, .7, .2, 1);
  --slide: 900ms;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bench); }
body { font: 400 13px/1.35 "JetBrains Mono", ui-monospace, monospace; color: var(--silk); -webkit-font-smoothing: antialiased; font-feature-settings: "liga" 0, "calt" 0; }
button { font: inherit; color: inherit; cursor: pointer; }
.boot *, .boot *::before, .boot *::after { transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 1ms !important; animation-duration: 1ms !important; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
svg.layer { position: absolute; left: 0; top: 0; display: block; overflow: visible; }
#wires { pointer-events: none; }
svg.g { width: 10px; height: 10px; flex: none; }
.t-need { color: var(--need); } .t-stuck { color: var(--stuck); } .t-ok { color: var(--ok); } .t-word { color: var(--word); }
.t-work { color: var(--work); } .t-fail { color: var(--fail); } .t-sleep { color: var(--sleep); }

/* ---------- silkscreen on the board ---------- */
.silk { position: absolute; white-space: nowrap; color: var(--silk); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: .3px; }
.brand .mk { width: 9px; height: 9px; background: var(--silk); transform: rotate(45deg); border-radius: 1.5px; }
.brand .badge { font-size: 10.5px; font-weight: 500; letter-spacing: 1.2px; color: var(--silk); border: 1px solid rgba(237, 240, 232, .55); border-radius: 3px; padding: 1px 6px 0; }
.spend { color: var(--silk); } .spend span { color: var(--silk-2); }
#said { position: absolute; margin: 0; display: flex; align-items: center; gap: 9px; white-space: nowrap; color: var(--silk-2); transform: translateX(-50%); transition: opacity .5s ease; }
#said i { width: 18px; height: 2px; border-radius: 1px; background: var(--lit); box-shadow: 0 0 6px rgba(255, 171, 56, .8); }
#said.gone { opacity: 0; }

/* ---------- agents: chips, and helpers as small parts ---------- */
#parts { position: absolute; inset: 0; pointer-events: none; }
.node { position: absolute; left: 0; top: 0; pointer-events: none; }
.node .kids, .node .kid { pointer-events: none; }
.chip { position: absolute; left: 0; top: 0; pointer-events: auto; height: var(--chip-h); padding: 0 var(--chip-pad); margin: 0;
  display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 3px; white-space: nowrap; text-align: left;
  border: 1px solid #383f3b; border-radius: 3px; color: #f0f2ec;
  background-color: #1f2221; background-image: linear-gradient(180deg, rgba(255, 255, 255, .045) 0%, rgba(255, 255, 255, 0) 55%, rgba(0, 0, 0, .06) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 1px 0 #040605, 0 7px 16px rgba(0, 0, 0, .42);
  transition: background-color .8s ease, border-color .35s ease, box-shadow .35s ease, transform .2s var(--ease), color .8s ease; }
.chip .nm { font-size: var(--nm); font-weight: 600; letter-spacing: -.1px; line-height: 1.15; }
.chip.compact { padding: 0 var(--chip-pad-c); }
.chip.compact .nm { display: flex; align-items: center; gap: 6px; }
.chip.compact .st { display: none; }
.chip.compact .end { top: calc(50% - 7.2px); height: 14.4px; }
.chip.compact .dot { top: 4px; }
.chip.compact.ghost .nm { color: #d6ded7; }
.chip .st { display: flex; align-items: center; gap: 6px; font-size: var(--st); font-weight: 500; color: #c3c9c1; line-height: 1.15; }
.chip .st.t-need { color: var(--need); } .chip .st.t-stuck { color: var(--stuck); } .chip .st.t-fail { color: var(--fail); }
.chip::before, .chip::after { content: ""; position: absolute; left: 10px; right: 10px; height: var(--lead); pointer-events: none;
  background: repeating-linear-gradient(90deg, var(--tin) 0 2.4px, transparent 2.4px 10px); opacity: .85; }
.chip::before { top: calc(-1px - var(--lead)); }
.chip::after { bottom: calc(-1px - var(--lead)); }
.chip .end { position: absolute; top: calc(50% - 13.2px); height: 26.4px; width: var(--lead); pointer-events: none;
  background: repeating-linear-gradient(180deg, var(--tin) 0 2.4px, transparent 2.4px 12px); opacity: .85; }
.chip .end.l { left: calc(-1px - var(--lead)); } .chip .end.r { right: calc(-1px - var(--lead)); }
.chip .end.hot { --tin: var(--lit); opacity: 1; }
.chip .dot { position: absolute; top: 6px; width: 5px; height: 5px; border-radius: 50%; background: #0b0d0c; box-shadow: inset 0 0 0 .8px rgba(255, 255, 255, .12); }
.chip .dot.l { left: 6px; } .chip .dot.r { right: 6px; }
.chip.lit { border-color: rgba(255, 192, 97, .85); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .05), 0 1px 0 #040605, 0 0 0 1px rgba(255, 192, 97, .16), 0 0 22px rgba(255, 171, 56, .16), 0 7px 16px rgba(0, 0, 0, .42); }
.chip.lit.stuck { border-color: rgba(255, 141, 97, .85); }
.chip.asking { border-color: rgba(255, 192, 97, .6); }
/* finished work powers down: flat, darker than the working chips, no shadow, dull leads */

.hl { position: absolute; display: flex; flex-direction: column; white-space: nowrap; line-height: var(--hl-line); pointer-events: none; }

    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0) 0 2px, rgba(255, 255, 255, .13) 2px 3px),
    linear-gradient(180deg, #ebeae4 0%, #dedcd5 52%, #d3d2ca 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .85), inset 0 0 0 1px rgba(60, 58, 48, .30), inset 0 -2px 0 rgba(0, 0, 0, .05); }
#core::before { content: ""; position: absolute; inset: 0; border-radius: 5px; pointer-events: none; opacity: 0; transition: opacity .6s ease;
  background: linear-gradient(180deg, #2c322f 0%, #242926 100%); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), inset 0 0 0 1px rgba(0, 0, 0, .5); }

#core .page { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }

#core h1 { margin: var(--l-gap1) 0 0; font-size: var(--l-h1); line-height: 1.22; letter-spacing: -.4px; font-weight: 700; text-wrap: balance; color: #121310; }

  font-size: var(--l-btn); font-weight: 600; color: #141512; white-space: nowrap; }

function paintKids(G, n, rec) {

      hl.style.top = r1(p.label.top) + 'px';

/* Wires that change with state: the connected copper, lit interrupt lines, queue pads, brackets, the failed fuse. */
function paintWires(G) {
  const P = G.P, keep = new Set();
  wires.setAttribute('width', G.W); wires.setAttribute('height', G.H); wires.setAttribute('viewBox', `0 0 ${G.W} ${G.H}`);
  const full = 4000;
  for (const n of G.nodes) {
    const id = n.a.id, d = pathD(n.lane.pts);
    // the agent's connection: its lane, drawn from the core out to its chip (longer or shorter, never rerouted)
    const len = n.connected ? lenTo(n.lane, n.near) : 0;
    keep.add('conn:' + id);
    const conn = wire('conn:' + id, 'path', { d, fill: 'none', stroke: n.lit ? '#3a6b50' : '#3c8a62', 'stroke-width': 2, 'stroke-linejoin': 'round', class: 'conn' + (hovered === id ? ' warm' : '') });
    conn.style.strokeDasharray = `${r1(len)} ${full}`;
    if (n.lit) {
      const pts = laneTo(n.lane, n.near).reverse();            // from the chip to the core: the interrupt runs towards you
      const dl = pathD(pts), stuck = n.lit === 'stuck', cur = n.qno === 1;
      keep.add('glow:' + id); keep.add('lit:' + id);
      wire('glow:' + id, 'path', { d: dl, fill: 'none', stroke: stuck ? '#ff7a45' : '#ffab38', 'stroke-width': cur ? 11 : 8, opacity: cur ? .42 : .28, filter: 'url(#glow)', 'stroke-linecap': 'round', 'stroke-linejoin': 'round', class: 'glow' });
      wire('lit:' + id, 'path', { d: dl, fill: 'none', stroke: stuck ? 'var(--stuck)' : 'var(--lit)', 'stroke-width': cur ? 2.8 : 2.3, 'stroke-linejoin': 'round', 'stroke-linecap': 'round',
        'stroke-dasharray': stuck ? '8 5' : 'none', class: 'lit', 'data-len': r1(plen(pts)) });
      // the pin on the package lights where the line arrives
      keep.add('pin:' + id);
      const p0 = n.lane.pts[0];
      wire('pin:' + id, 'circle', { cx: p0[0], cy: p0[1], r: 3.2, fill: stuck ? 'var(--stuck)' : 'var(--lit)' });
    }
    if (n.qno) {
      keep.add('pad:' + id); keep.add('padn:' + id);
      const [x, y] = n.lane.pad, one = n.qno === 1;
      wire('pad:' + id, 'circle', { cx: x, cy: y, r: P.padR, fill: one ? 'var(--lit)' : '#0f3326', stroke: n.lit === 'stuck' ? 'var(--stuck)' : 'var(--lit)', 'stroke-width': one ? 0 : 1.6, class: 'pad', 'data-box': 'pad:' + n.qno });
      const t = wire('padn:' + id, 'text', { x, y: y + 4.4, 'text-anchor': 'middle', 'font-family': 'JetBrains Mono', 'font-size': 12.5, 'font-weight': 700, fill: one ? '#1b1305' : 'var(--lit)', class: 'padn' });
      if (t.textContent !== String(n.qno)) t.textContent = String(n.qno);

      keep.add('fuse2:' + id);
      wire('fuse2:' + id, 'path', { d: `M${Math.min(nx, x2) - 1} ${y}H${Math.max(nx, x2) + 1}`, fill: 'none', stroke: '#0f3326', 'stroke-width': 5 });
      keep.add('fuse3:' + id);
      wire('fuse3:' + id, 'path', { d: `M${nx} ${y - 6}v12M${x2} ${y - 6}v12`, fill: 'none', stroke: '#edf0e8', 'stroke-opacity': .6, 'stroke-width': 1.2 });
    }
  }

  // (when a helper asks, they go round its agent: the lid names the agent, and the lit twig leads on to the helper)
  const cur = G.nodes.find(n => n.current);
  if (cur) {
    keep.add('brackets');

    const X = cur.chip.x - L - m, Y = cur.chip.y - L - m, X2 = cur.chip.x + cur.w + L + m, Y2 = cur.chip.y + cur.h + L + m;
    wire('brackets', 'path', { d: `M${r1(X)} ${r1(Y + k)}V${r1(Y)}H${r1(X + k)}M${r1(X2 - k)} ${r1(Y)}H${r1(X2)}V${r1(Y + k)}M${r1(X2)} ${r1(Y2 - k)}V${r1(Y2)}H${r1(X2 - k)}M${r1(X + k)} ${r1(Y2)}H${r1(X)}V${r1(Y2 - k)}`,
      fill: 'none', stroke: 'var(--silk)', 'stroke-width': 1.6, 'stroke-linecap': 'square', class: 'brackets' });
  }
  // keep the leader and any pulse in flight
  for (const [k] of WIRES) if (k.startsWith('leader') || k.startsWith('pulse')) keep.add(k);
  dropWires(keep);

  const rank = k => k.startsWith('conn') ? 0 : k.startsWith('fuse') ? 1 : k.startsWith('glow') ? 2 : k.startsWith('lit') ? 3 : k.startsWith('pin') ? 4 : k.startsWith('pad:') ? 5 : k.startsWith('padn') ? 6 : 7;
  [...WIRES.entries()].sort((a, b) => rank(a[0]) - rank(b[0])).forEach(([, e]) => wires.appendChild(e));
}

    return { key: 'empty', idle: true, count: 'All clear', shape: 'ok', tone: 'ok', h1: 'Nothing needs you.', meta: working ? `${working} agent${working === 1 ? ' is' : 's are'} working quietly.` : 'Say or type what you want.' };
  }

  const waiting = `waiting ${duration(NOW - (a.ask?.createdAt || a.stateSince))}`;
  const m = { key: `${a.id}|${a.state}|${a.ask?.id}`, agentId: a.id, count: `1 of ${q.length} need${q.length === 1 ? 's' : ''} you`, shape: LOOK[a.state].shape, tone: LOOK[a.state].tone };

/* ======================================================================================

  sp.style.left = 'auto'; sp.style.right = (G.W - b.r + 44) + 'px'; sp.style.top = r1(y - P.title * .68) + 'px'; sp.dataset.box = 'spend';

/* ======================================================================================
   Render: layout, then update everything in place
   ====================================================================================== */

      if (n.asking) for (const e of tw) anim(e, [{ opacity: 0 }, { opacity: 1 }], { duration: 300 * D, delay: 0 });
    }
  }
  // 4. the lid: the old words lift away, the next item rises in
  const newPage = pagesEl.querySelector('.page:not(.old)');
  if (oldPage && oldKey !== lastPageKey) {
    anim(oldPage, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-10px)' }], { duration: 240 * D, delay: tDrain + 120, fill: 'forwards' })?.finished.then(() => oldPage.remove(), () => {});
    anim(newPage, [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }], { duration: 380 * D, delay: tDrain + 360 });
  } else oldPage?.remove();
  // 5. the brackets move to what the core shows now
  if (curChanged) {
    if (oldBrackets) { wires.appendChild(oldBrackets); anim(oldBrackets, [{ opacity: 1 }, { opacity: 0 }], { duration: 180 * D, delay: tDrain, fill: 'forwards' })?.finished.then(() => oldBrackets.remove(), () => {}); }
    const nb = WIRES.get('brackets');
    if (nb) anim(nb, [{ opacity: 0 }, { opacity: 1 }], { duration: 260 * D, delay: Math.max(tDrain + 420, opts.bracketsAt || 0) });
  }
}

/* Answer what the core shows. One answer at a time: the next ask cannot be answered before it has risen into view. */
let lockUntil = 0;
function settleFocus(had) { if (had) pagesEl.querySelector('.page:not(.old) .big.pri, .page:not(.old) .big')?.focus({ preventScroll: true }); }
function answer(choice) {
  const a = needsQueue()[0]; if (!a || performance.now() < lockUntil) return;
  lockUntil = performance.now() + 900;
  const had = coreEl.contains(document.activeElement);
  pinned = null; hovered = null; hideCard(); reply(null);
  transition(() => {
    const was = a.state;
    a.ask = null; a.stateSince = NOW; a.lastEventAt = NOW;
    a.state = /^stop/i.test(choice) ? 'stopped' : 'working';
    if (a.state === 'working') {
      const step = a.plan?.items?.find(i => i.status === 'in_progress');
      a.now = was === 'needs_ok' && step ? step.text.replace(/^Update the /, 'Updating ').replace(/^Add /, 'Adding ') : was === 'question' ? 'Removing dead code' : 'Trying again';
      if (a.parentId) a.now = 'Installing the test package';
    }
    a.approvals = { ...(a.approvals || {}), byYou: ((a.approvals || {}).byYou || 0) + 1 };
    S.answered++;
    const who = a.parentId ? `${S.byId.get(a.parentId).name}'s helper` : a.name;
    S.notice = /^(allow|do it)/i.test(choice) ? `Allowed. ${who} carries on.` : /^deny/i.test(choice) ? `Denied. ${who} will find another way.` : /^stop/i.test(choice) ? `Stopped ${who}.` : `Sent “${clip(choice, 28)}” to ${who}.`;
  });
  settleFocus(had);
}
/* What you typed or said: the core asks you to confirm before anything starts. */
function confirmAnswer(choice) {
  if (performance.now() < lockUntil) return;
  lockUntil = performance.now() + 900;
  const had = coreEl.contains(document.activeElement);
  transition(() => { const said = S.confirm.sentence; S.confirm = null; S.notice = /^do it/i.test(choice) ? `Starting: ${clip(said, 40)}` : 'Cancelled. Nothing was started.'; });
  settleFocus(had);
}
/* "Answer in your own words" and "Give it a hint": the input addresses that agent until you send or press ×. */
function reply(a) {
  barEl.classList.toggle('replying', !!a);
  $('toText').textContent = a ? `to ${a.parentId ? S.byId.get(a.parentId).name + "'s helper" : a.name}:` : '';
  if (a) sayEl.focus();
}
$('toCancel').addEventListener('click', () => { reply(null); sayEl.focus(); });
barEl.addEventListener('submit', e => {
  e.preventDefault();
  const text = sayEl.value.trim(); if (!text) return;
  sayEl.value = ''; barEl.classList.remove('typed');
  if (barEl.classList.contains('replying')) { reply(null); answer(text); return; }
  transition(() => { S.confirm = { sentence: text.replace(/^./, c => c.toUpperCase()).replace(/([^.?!])$/, '$1.'), detail: 'on Your laptop, with a $2 budget' }; });
});
/* An agent finishes: it slides out to the board edge along its own lane, and powers down. */
function finish(id, state = 'done_checked') {
  transition(() => { const a = S.byId.get(id); a.state = state; a.endedAt = NOW; for (const k of kidsOf(id)) if (!ENDED.has(k.state)) k.state = 'finished'; });
}
/* A helper asks: its agent slides in, the line lights from the helper, through the agent, into the core. */
function helperAsks(kidId, ask) {
  transition(() => { const k = S.byId.get(kidId); k.state = 'needs_ok'; k.ask = ask; k.stateSince = NOW; });
}
/* A step: one pulse runs along the line towards the core, then the board is still again (throttled, as orbit.steps). */
const lastStep = new Map();
let PULSES = 0;
function step(id) {
  const n = G.byId.get(id); if (!n || !n.connected || REDUCED) return;
  if (performance.now() - (lastStep.get(id) || -1e9) < 1100) return;
  lastStep.set(id, performance.now()); PULSES++;
  const pts = laneTo(n.lane, n.near).reverse(), L = plen(pts), key = 'pulse:' + id + ':' + Math.round(performance.now());
  const p = wire(key, 'path', { d: pathD(pts), fill: 'none', stroke: '#e3f2e9', 'stroke-width': 2.6, 'stroke-linecap': 'round', opacity: .9 });
  const dash = Math.min(16, L * .2);
  p.animate([{ strokeDasharray: `${dash} ${L + 40}`, strokeDashoffset: 0, opacity: 0 }, { opacity: .95, offset: .12 }, { opacity: .95, offset: .8 }, { strokeDasharray: `${dash} ${L + 40}`, strokeDashoffset: -(L - dash), opacity: 0 }],
    { duration: Math.min(1400, 500 + L * 2.2), easing: 'cubic-bezier(.45,.05,.35,1)' }).finished.then(() => { p.remove(); WIRES.delete(key); }, () => {});
}

/* ======================================================================================
   ?motion: the signature movements, on a loop. ?motion&t=ms holds any moment of it, for stills.
   A helper asks; its agent slides in and the line charges. You allow Checkout fix: its line drains, the pads renumber,
   the next item rises and the chip slides back out. Later Invoice... no: Onboarding's helper is allowed, and Onboarding
   then finishes, sliding to the edge and powering down.
   ====================================================================================== */
const SCRIPT = [
  [600, () => helperAsks('902d13-58d802d4', { id: 'm-ask', type: 'permission', sentence: 'Write sign-up flow tests wants to run a command', plain: "Onboarding's helper wants to add a package for the sign-up tests.", detail: 'npm install --save-dev @testing-library/user-event', options: ['Allow', 'Deny'], createdAt: NOW })],
  [4200, () => answer('Allow')],
  [7600, () => answer('Allow')],
  [11000, () => finish('902d13')],
];
function motion() {
  const T = VIEW.t;
  if (T != null) {   // seek: apply every change up to T, then hold that moment
    let lastAt = 0, before = new Set();
    for (const [at, f] of SCRIPT) {
      if (at > T) break;
      for (const a of TL.splice(0)) a.finish();
      for (const a of document.getAnimations()) if (a instanceof CSSTransition) a.finish();
      before = new Set(document.getAnimations());
      lockUntil = 0;   // seeking runs the script in one instant; the one-answer-at-a-time lock is for people
      f(); lastAt = at;
    }
    for (const el of document.querySelectorAll('.chip')) getComputedStyle(el).backgroundColor;   // start pending transitions
    for (const a of document.getAnimations()) if (!before.has(a)) { a.pause(); a.currentTime = Math.max(0, T - lastAt); }
    document.documentElement.dataset.motionT = String(T);
    return;
  }
  const run = () => { for (const [at, f] of SCRIPT) setTimeout(f, at); setTimeout(() => location.reload(), 14500); };
  run();
}
/* Live: in the normal views, working agents take steps now and then (simulated; the app fires one per real step). */
function liveSteps() {
  if (REDUCED || VIEW.t != null || Q.has('still')) return;
  const tick = () => {
    const working = G.nodes.filter(n => n.working);
    if (working.length) step(working[Math.floor(Math.random() * working.length)].a.id);
    setTimeout(tick, 2400 + Math.random() * 3000);
  };
  setTimeout(tick, 3000);
}

/* ======================================================================================
   Check our own work: overlaps, clipping, words on traces, the card against the lid, lit-line lengths,
   lane stability, contrast. Written into #audit for the headless shooter.
   ====================================================================================== */
function lum(hex) {
  const v = hex.replace('#', ''); const c = [0, 2, 4].map(i => parseInt(v.slice(i, i + 2), 16) / 255).map(x => x <= .04045 ? x / 12.92 : ((x + .055) / 1.055) ** 2.4);
  return .2126 * c[0] + .7152 * c[1] + .0722 * c[2];
}
const ratio = (a, b) => { const [x, y] = [lum(a), lum(b)].sort((p, q) => q - p); return Math.round((x + .05) / (y + .05) * 100) / 100; };
const CONTRAST = [
  ['silk on mask', '#edf0e8', '#0f3326'], ['silk-2 on mask', '#b4c4b8', '#0f3326'], ['silk-2 on mask centre', '#b4c4b8', '#123c2d'], ['YOU designator', '#b4c4b8', '#0f3326'],
  ['chip name', '#f0f2ec', '#282c2b'], ['chip status', '#c3c9c1', '#282c2b'], ['need on chip', '#ffb950', '#282c2b'], ['stuck on chip', '#ff8d61', '#282c2b'],
  ['work word on chip', '#c3c9c1', '#1d201f'], ['ghost name', '#d6ded7', '#163127'], ['ghost status', '#a9bcae', '#163127'], ['fail on ghost', '#ff8b80', '#163127'],
  ['ok mark on ghost (3:1)', '#6fdcaa', '#163127', 3], ['need word on mask', '#ffb950', '#0f3326'],
  ['h1 on lid', '#121310', '#d3d2ca'], ['count on lid', '#393c36', '#d3d2ca'], ['meta on lid', '#4a4e47', '#d3d2ca'], ['quiet on lid', '#3f423c', '#d3d2ca'],
  ['need mark on lid (3:1)', '#8a4e00', '#d3d2ca', 3], ['input hint in field', '#474b44', '#cfcec5'], ['exact command', '#141512', '#c5c4bc'],
  ['primary button', '#f4f3ee', '#161714'], ['secondary button', '#141512', '#e2e1d9'],
  ['idle h1', '#e9ece5', '#242926'], ['idle meta', '#aebbb1', '#242926'], ['idle input hint', '#a7b4aa', '#181c1a'],
  ['pad 1 number', '#1b1305', '#ffc061'], ['pad n number', '#ffc061', '#0f3326'],
  ['card text', '#edf0ea', '#111915'], ['card label', '#a3b3a7', '#111915'], ['card sub', '#a9b8ad', '#111915'], ['card work', '#9cbcff', '#111915'],
  ['machine note', '#b4c4b8', '#0b291e'], ['hint', '#b4c4b8', '#0f3326'],
];
function audit() {
  const out = { vp: [innerWidth, innerHeight], view: location.search || '(overview)', size: G.P.name, errors: $('errors')?.textContent || '' };
  out.fonts = [...document.fonts].filter(f => f.status === 'loaded').map(f => `${f.weight}`).join(',');
  out.fontCheck = [400, 500, 600, 700].map(w => document.fonts.check(`${w} 12px "JetBrains Mono"`)).join(',');
  const els = [...document.querySelectorAll('[data-box], .chip, .part')].filter(e => !e.closest('[hidden]') && !e.hidden && e.id !== 'card');
  const boxes = els.map(e => { const r = e.getBoundingClientRect(); return { k: e.dataset.box || (e.classList.contains('chip') ? 'chip:' + S.byId.get(e.dataset.id)?.name : 'part:' + S.byId.get(e.dataset.id)?.name), x: r.left, y: r.top, w: r.width, h: r.height, el: e }; })
    .filter(b => b.w > 0 && b.h > 0);
  const ov = [];
  for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
    const a = boxes[i], b = boxes[j];
    if (a.el.contains(b.el) || b.el.contains(a.el)) continue;
    const ix = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x), iy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
    if (ix > .5 && iy > .5) ov.push(`${a.k} × ${b.k} (${ix.toFixed(1)}×${iy.toFixed(1)})`);
  }
  out.overlaps = ov;
  out.outside = boxes.filter(b => b.x < G.board.x - .5 || b.y < G.board.y - .5 || b.x + b.w > G.board.r + .5 || b.y + b.h > G.board.b + .5).map(b => b.k);
  // words must not sit on traces: every text box against every lane up to its chip, and every twig
  const segs = [];
  for (const n of G.nodes) {
    const add = (pts, who) => { for (let i = 1; i < pts.length; i++) segs.push([pts[i - 1], pts[i], who]); };
    add(n.connected ? laneTo(n.lane, n.near) : [], n.a.name);
    const far = n.lane.pts[n.lane.pts.length - 1]; add([[n.lane.mx(n.near - n.w), n.lane.y], far], n.a.name + ' rail');
    for (const p of n.helpers) if (p.branch) add(p.branch.map(q => [n.chip.x + q[0], n.chip.y + q[1]]), n.a.name + ' twig');
  }
  const words = boxes.filter(b => /^(hlabel|said|machine|brand|spend)/.test(b.k));
  const hits = [];
  for (const t of words) for (const [p, q, who] of segs) {
    const steps = Math.ceil(Math.hypot(q[0] - p[0], q[1] - p[1]) / 2);
    for (let s = 0; s <= steps; s++) { const x = p[0] + (q[0] - p[0]) * s / steps, y = p[1] + (q[1] - p[1]) * s / steps; if (x > t.x - 1 && x < t.x + t.w + 1 && y > t.y && y < t.y + t.h) { hits.push(`${t.k} on ${who}`); break; } }
  }
  out.wordsOnTraces = [...new Set(hits)];
  const page = pagesEl.querySelector('.page:not(.old)');
  out.lidFit = page && page.scrollHeight > page.clientHeight + 1 ? `OVERFLOW ${page.scrollHeight} > ${page.clientHeight}` : 'fits';
  out.lid = { w: G.lid.w, h: G.lid.h, coreH: G.core.h, h1: page?.querySelector('h1')?.textContent, cls: page?.querySelector('h1')?.className };
  out.litLines = G.nodes.filter(n => n.lit).map(n => `${n.a.name} ${Math.round(lenTo(n.lane, n.near))}px`);
  out.minLit = Math.min(...G.nodes.filter(n => n.lit).map(n => lenTo(n.lane, n.near)));
  out.lanes = G.nodes.map(n => `${n.lane.side}${n.lane.rowIdx} ${n.stop} ${n.a.name}${n.qno ? ' #' + n.qno : ''}`);
  if (G.dense) out.dense = { rows: G.nRows, pitch: G.pitch, tray: G.tray.length, active: G.nodes.length, coreH: G.core.h };
  if (VIEW.motion != null) out.pos = G.nodes.map(n => `${n.a.name} want ${r1(n.chip.x)},${r1(n.chip.y)} got ${getComputedStyle(NODES.get(n.a.id).el).transform} anims ${NODES.get(n.a.id).el.getAnimations().length}`);
  out.demoLanes = [...DEMO_IDS].filter(id => LANES.has(id)).map(id => `${id}:${LANES.get(id).side}${LANES.get(id).row}`).join(' ');
  out.demoPos = [...DEMO_IDS].filter(id => G.byId.has(id)).map(id => { const n = G.byId.get(id); return `${n.a.name}@${r1(n.chip.x)},${r1(n.chip.y)}`; });
  if (G.cardBox) { const c = G.cardBox, lid = { x: G.core.x, y: G.core.y, w: G.core.w, h: G.core.h };
    out.card = { of: S.byId.get(c.of).name, x: c.x, y: c.y, w: c.w, h: c.h, onCore: overlap(c, lid) > 0, band: c.band, clipped: [...cardEl.querySelectorAll('strong, .ln > span:last-child')].filter(e => e.scrollWidth > e.clientWidth + 1).map(e => e.textContent.trim()) }; }
  out.contrast = CONTRAST.map(([k, f, b, min = 4.5]) => `${ratio(f, b) >= min ? 'ok ' : 'LOW'} ${ratio(f, b)} ${k}`).filter(s => VIEW.cards || s.startsWith('LOW'));
  // identity: rendering again keeps the same DOM nodes and focus
  const before = [...NODES.values()].map(r => r.chip), focus = document.activeElement;
  render();
  out.stableDom = [...NODES.values()].every((r, i) => r.chip === before[i]) && document.activeElement === focus;
  if (VIEW.cards) {   // ?cards: open every chip's and helper's card and check it never covers the lid
    out.cards = [];
    for (const n of G.nodes) for (const id of [n.a.id, ...n.helpers.map(p => p.k.id)]) {
      showCard(id, true); const c = G.cardBox;
      out.cards.push(`${c.onCore || overlap(c, { x: G.core.x, y: G.core.y, w: G.core.w, h: G.core.h }) > 0 ? 'ON-CORE' : 'ok'} ${S.byId.get(id).name} ${c.w}x${c.h}${c.band ? ' band' : ''}`);
    }
    hideCard();
  }
  $('audit').textContent = JSON.stringify(out, null, 1);
}

/* The running page, checked: no errors, one lid page, no stray wires, nothing moving at rest. */
function liveCheck() {
  let out = {}; try { out = JSON.parse($('audit').textContent || '{}'); } catch (e) {}
  out.live = { at: Math.round(performance.now()), errors: $('errors')?.textContent || '', pages: pagesEl.querySelectorAll('.page').length,
    strayWires: [...wires.children].filter(e => WIRES.get(e.dataset.key) !== e).length, moving: document.getAnimations().filter(a => a.playState === 'running').length,
    pulses: PULSES, answered: S.answered, focus: document.activeElement === document.body ? 'body' : (document.activeElement?.textContent || '').trim().slice(0, 24),
    lid: pagesEl.querySelector('.page:not(.old) h1')?.textContent, queue: needsQueue().map(a => a.name), notice: S.notice || '' };
  out.live.movingWhat = [...new Set(document.getAnimations().filter(a => a.playState === 'running').map(a => `${a.constructor.name}:${(a.effect?.target?.getAttribute?.('class') || a.effect?.target?.tagName || '')}:${Math.round(a.currentTime)}`))].slice(0, 12);
  // every chip where its lane says it should be (nothing pinned by a finished animation)
  out.live.misplaced = G.nodes.filter(n => { const m = new DOMMatrix(getComputedStyle(NODES.get(n.a.id).el).transform); return Math.abs(m.e - n.chip.x) > .6 || Math.abs(m.f - n.chip.y) > .6; }).map(n => n.a.name);
  out.live.vp = [innerWidth, innerHeight];
  $('audit').textContent = JSON.stringify(out, null, 1);
}

window.__liveCheck = liveCheck;   // for tools/live.mjs

/* ======================================================================================
   Boot
   ====================================================================================== */
function boot() {
  render();
  if (VIEW.card) {
    const n = G.nodes.find(x => x.a.name.toLowerCase().replace(/\s+/g, '-') === VIEW.card || x.a.id === VIEW.card);
    const k = !n && S.agents.find(x => x.name.toLowerCase().replace(/\s+/g, '-') === VIEW.card);
    const id = n ? n.a.id : k ? k.id : null;
    if (id) { hovered = id; showCard(id, true); }
  }
  if (VIEW.voice) listen(true);
  if (VIEW.machines) toggleMachines(machEl.querySelector('[data-id="cloud-2"]'));
  setTimeout(() => {
    if (G.W !== innerWidth || G.H !== innerHeight) render();
    document.documentElement.classList.remove('boot');
    if (VIEW.motion != null) motion(); else liveSteps();
    audit();
    if (VIEW.motion == null) setTimeout(audit, 700);
    if (Q.has('play')) {   // press the primary button twice, as a person would, a few seconds apart
      setTimeout(() => { pagesEl.querySelector('.page:not(.old) .big.pri')?.focus(); pagesEl.querySelector('.page:not(.old) .big.pri')?.click(); pagesEl.querySelector('.page:not(.old) .big.pri')?.click(); }, 900);
      setTimeout(() => pagesEl.querySelector('.page:not(.old) .big.pri')?.click(), 3400);
    }
    if (Q.has('check')) setTimeout(liveCheck, +Q.get('check'));
  }, 450);
}
let auditTimer = 0;
addEventListener('resize', () => { if (G && (G.W !== innerWidth || G.H !== innerHeight)) { render(); clearTimeout(auditTimer); if (!document.documentElement.classList.contains('boot') && VIEW.motion == null) auditTimer = setTimeout(audit, 200); } });
const faces = ['400', '500', '600', '700'].map(w => document.fonts.load(`${w} 12px "JetBrains Mono"`));
Promise.all(faces).then(() => document.fonts.ready).then(boot, boot);
})();
</script>
